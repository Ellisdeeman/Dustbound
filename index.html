<script>
'use strict';
// ===== CORE: canvas, palette, pixel buffers, font, input, audio =====
const W=160,H=144,TS=16;
const PAL=['#e6dfb6','#aca46c','#5c6142','#23251a'];
const PALRGB=PAL.map(h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)));
const cv=document.getElementById('screen');const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
let FC=0;
const rand=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[rand(a.length)];
function hash(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul((s|0)+7,982451653);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}

// --- pixel buffers (0=transparent, 1..4 = palette light..dark)
function mkBuf(w,h){return{w,h,d:new Uint8Array(w*h)}}
function px(b,x,y,c){x=Math.floor(x);y=Math.floor(y);if(x>=0&&y>=0&&x<b.w&&y<b.h)b.d[y*b.w+x]=c}
function gp(b,x,y){return(x>=0&&y>=0&&x<b.w&&y<b.h)?b.d[y*b.w+x]:0}
function rect(b,x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)px(b,x+i,y+j,c)}
function ell(b,cx,cy,rx,ry,c){for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)px(b,x,y,c)}}
function line(b,x0,y0,x1,y1,c,t){t=t||1;const n=Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0)))||1;for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;if(t<=1)px(b,Math.round(x),Math.round(y),c);else ell(b,x+.5,y+.5,t/2,t/2,c)}}
function poly(b,pts,c){let a=1e9,bb=1e9,cc=-1e9,dd=-1e9;for(const[x,y]of pts){a=Math.min(a,x);bb=Math.min(bb,y);cc=Math.max(cc,x);dd=Math.max(dd,y)}
 for(let y=Math.floor(bb);y<=dd;y++)for(let x=Math.floor(a);x<=cc;x++){const X=x+.5,Y=y+.5;let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>Y)!=(yj>Y))&&(X<(xj-xi)*(Y-yi)/(yj-yi)+xi))ins=!ins}if(ins)px(b,x,y,c)}}
function stamp(b,x,y,rows){rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const ch=r[i];if(ch!=='.')px(b,x+i,y+j,+ch)}})}
function blit(d,s,dx,dy){for(let y=0;y<s.h;y++)for(let x=0;x<s.w;x++){const v=s.d[y*s.w+x];if(v)px(d,dx+x,dy+y,v)}}
function outline(b,c){c=c||4;const o=b.d.slice();const n=(x,y)=>x>=0&&y>=0&&x<b.w&&y<b.h&&o[y*b.w+x]&&o[y*b.w+x]!==c;
 for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){if(o[y*b.w+x])continue;if(n(x-1,y)||n(x+1,y)||n(x,y-1)||n(x,y+1))b.d[y*b.w+x]=c}}
function autoShade(b){const o=b.d.slice();const g=(x,y)=>(x<0||y<0||x>=b.w||y>=b.h)?0:o[y*b.w+x];
 for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){if(o[y*b.w+x]!==2)continue;if(!g(x,y+2)||!g(x+2,y+1))b.d[y*b.w+x]=3;else if(!g(x-1,y-2)&&!g(x,y-2))b.d[y*b.w+x]=1}}
function toCanvas(b,flip){const c=document.createElement('canvas');c.width=b.w;c.height=b.h;const g=c.getContext('2d');const id=g.createImageData(b.w,b.h);
 for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++){const v=b.d[y*b.w+(flip?b.w-1-x:x)];if(!v)continue;const p=PALRGB[v-1],i=(y*b.w+x)*4;id.data[i]=p[0];id.data[i+1]=p[1];id.data[i+2]=p[2];id.data[i+3]=255}
 g.putImageData(id,0,0);return c}

// --- bitmap font 5x7 (column-major, bit0=top), cell 6x8
const FCH=" !\"#$%&'()*+,-./0123456789:;<=>?ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz\x01\x02\x03";
const FDAT=("0000000000 00005f0000 0007000700 147f147f14 242a7f2a12 2313086462 3649562050 0000070000 001c224100 0041221c00 2a1c7f1c2a 08083e0808 0050300000 0808080808 0060600000 2010080402 "+
"3e5149453e 00427f4000 4261514946 2141454b31 1814127f10 2745454539 3c4a494930 0171090503 3649494936 064949291e 0036360000 0056360000 0814224100 1414141414 0041221408 0201510906 "+
"7c1211127c 7f49494936 3e41414122 7f4141221c 7f49494941 7f09090901 3e4149497a 7f0808087f 00417f4100 2040413f01 7f08142241 7f40404040 7f020c027f 7f0408107f 3e4141413e 7f09090906 3e4151215e 7f09192946 4649494931 01017f0101 3f4040403f 1f2040201f 3f4038403f 6314081463 0708700807 6151494543 "+
"007f414100 0041417f00 4040404040 "+
"2054545478 7f48444438 3844444420 384444487f 3854545418 087e090102 18a4a4a47c 7f08040478 00447d4000 2040443d00 7f10284400 00417f4000 7c04180478 7c08040478 3844444438 fc24242418 18242424fc 7c08040408 4854545420 043f444020 3c4040207c 1c2040201c 3c4030403c 4428102844 1ca0a0a07c 4464544c44 "+
"7f3e1c0800 040c1c0c04 0c1e3c1e0c").split(' ');
const FONT={},FIDX={};
function buildFont(){for(let i=0;i<FCH.length;i++)FIDX[FCH[i]]=i;
 for(let c=1;c<=4;c++){const cn=document.createElement('canvas');cn.width=FCH.length*6;cn.height=8;const g=cn.getContext('2d');g.fillStyle=PAL[c-1];
  for(let i=0;i<FCH.length;i++){const hx=FDAT[i];for(let col=0;col<5;col++){const v=parseInt(hx.substr(col*2,2),16);for(let r=0;r<8;r++)if(v>>r&1)g.fillRect(i*6+col,r,1,1)}}FONT[c]=cn}}
function text(s,x,y,c,sc){c=c||4;sc=sc||1;s=String(s);for(let i=0;i<s.length;i++){let k=FIDX[s[i]];if(k===undefined)k=FIDX['?'];if(s[i]===' ')continue;ctx.drawImage(FONT[c],k*6,0,6,8,Math.round(x+i*6*sc),Math.round(y),6*sc,8*sc)}}
function textC(s,cx,y,c,sc){sc=sc||1;text(s,cx-String(s).length*3*sc,y,c,sc)}
function fill(c,x,y,w,h){ctx.fillStyle=PAL[c-1];ctx.fillRect(x,y,w,h)}
function box(x,y,w,h){fill(1,x,y,w,h);fill(4,x,y,w,1);fill(4,x,y+h-1,w,1);fill(4,x,y,1,h);fill(4,x+w-1,y,1,h);
 fill(4,x+2,y+2,w-4,1);fill(4,x+2,y+h-3,w-4,1);fill(4,x+2,y+2,1,h-4);fill(4,x+w-3,y+2,1,h-4);fill(1,x+2,y+2,1,1);fill(1,x+w-3,y+2,1,1);fill(1,x+2,y+h-3,1,1);fill(1,x+w-3,y+h-3,1,1)}

// --- input
const held={},prs={};
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',KeyZ:'a',Enter:'a',Space:'a',KeyX:'b',Backspace:'b',Escape:'b',ShiftLeft:'start',ShiftRight:'start'};
const DIRK=['up','down','left','right'];
let textHook=null;
addEventListener('keydown',e=>{initAudio();
 if(textHook&&textHook(e)){e.preventDefault();return}
 if(e.code==='KeyM'){muted=!muted;e.preventDefault();return}
 const k=KM[e.code];if(!k)return;e.preventDefault();
 if(!e.repeat||DIRK.includes(k))prs[k]=true;held[k]=true;if(e.code==='Enter'&&!e.repeat)prs.enter=true});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)held[k]=false});
addEventListener('blur',()=>{for(const k in held)held[k]=false});
function bindTouch(){document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
 const dn=e=>{e.preventDefault();initAudio();held[k]=true;prs[k]=true;if(k==='start')prs.enter=false;el.classList.add('on')};
 const up=e=>{e.preventDefault();held[k]=false;el.classList.remove('on')};
 el.addEventListener('pointerdown',dn);el.addEventListener('pointerup',up);el.addEventListener('pointerleave',up);el.addEventListener('pointercancel',up)})}

// --- audio
let AC=null,muted=false,master=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.13;master.connect(AC.destination);nextT=AC.currentTime+.05}catch(e){AC=null}}
function tone(f,d,type,v,t0,slide){if(!AC||muted||!f)return;const t=AC.currentTime+(t0||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(20,f+slide),t+d);
 g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
function noise(d,v,t0){if(!AC||muted)return;const t=AC.currentTime+(t0||0);const n=Math.floor(AC.sampleRate*d);const buf=AC.createBuffer(1,n,AC.sampleRate);const a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
 const s=AC.createBufferSource();s.buffer=buf;const g=AC.createGain();g.gain.setValueAtTime(v||.4,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(g);g.connect(master);s.start(t)}
const SFX={sel:()=>tone(1046,.04,'square',.2),ok:()=>{tone(784,.05,'square',.25);tone(1175,.08,'square',.25,.05)},no:()=>tone(150,.12,'square',.3),bump:()=>tone(80,.07,'square',.3),
 hit:()=>{noise(.15,.5);tone(200,.12,'square',.25,0,-120)},big:()=>{noise(.3,.6);tone(120,.25,'sawtooth',.3,0,-80)},
 enc:()=>{[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.07,'square',.25,i*.06))},lvl:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.25,i*.1))},
 heal:()=>{[659,784,988,1318,988,1318].forEach((f,i)=>tone(f,.1,'triangle',.4,i*.09))},door:()=>{tone(300,.06);tone(200,.08,'square',.2,.06)},
 shake:()=>tone(330,.06,'square',.2),catch:()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,.1,'square',.25,i*.08))},faint:()=>tone(400,.5,'square',.25,0,-350),
 dice:()=>noise(.03,.3),pass:()=>{tone(880,.08);tone(1318,.15,'square',.25,.08)},fail:()=>{tone(220,.1);tone(165,.2,'square',.25,.1)},item:()=>{[784,1046,1318].forEach((f,i)=>tone(f,.08,'square',.22,i*.07))}};
// --- tiny chiptune sequencer
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(s){const m=/^([A-G])(#?)(\d)$/.exec(s);if(!m)return 0;return 440*Math.pow(2,(12*(+m[3]+1)+NOTE[m[1]]+(m[2]?1:0)-69)/12)}
const SONGS={
 title:{bpm:84,tr:[{w:'square',v:.07,n:'E4 . G4 . A4 . . G4 E4 . D4 . E4 . . . C4 . D4 . E4 . G4 . D4 . . . . . . .'},{w:'triangle',v:.25,n:'A2 . . . A2 . . . F2 . . . F2 . . . C3 . . . C3 . . . G2 . . . G2 . E2 .'}]},
 town:{bpm:100,tr:[{w:'square',v:.06,n:'C5 . A4 . G4 . E4 . G4 . A4 . C5 . . . D5 . C5 . A4 . G4 . A4 . . . . . . . E4 . G4 . A4 . C5 . A4 . G4 . E4 . D4 . E4 . C4 . . . . . . .'},{w:'triangle',v:.22,n:'F2 . C3 . F2 . C3 . A2 . E3 . A2 . E3 . D2 . A2 . D2 . A2 . G2 . D3 . G2 . D3 .'}]},
 wild:{bpm:112,tr:[{w:'square',v:.05,n:'A4 . . C5 B4 . A4 . E4 . . . G4 . A4 . . . . . E4 . D4 . E4 . . . . . . . A4 . . C5 D5 . E5 . D5 . C5 . B4 . G4 . A4 . . . . . . . . . . . . . . .'},{w:'triangle',v:.22,n:'A2 . A2 E2 A2 . A2 E2 G2 . G2 D2 G2 . G2 D2 F2 . F2 C2 F2 . F2 C2 E2 . E2 B1 E2 . G2 .'}]},
 fort:{bpm:96,tr:[{w:'square',v:.05,n:'D4 . D4 F4 . D4 G4 . F4 . E4 . D4 . . . C4 . D4 . F4 . E4 . D4 . . . . . . .'},{w:'triangle',v:.25,n:'D2 D2 . D2 D2 . C2 . D2 D2 . D2 F2 . E2 . A1 A1 . A1 C2 . C2 . D2 . . . D2 . . .'}]},
 battle:{bpm:150,tr:[{w:'square',v:.06,n:'A4 A4 C5 A4 D5 . C5 . A4 A4 C5 A4 E5 . D5 . F5 E5 D5 C5 D5 C5 B4 G4 A4 . . . E5 . . .'},{w:'triangle',v:.25,n:'A2 A3 A2 A3 A2 A3 A2 A3 F2 F3 F2 F3 G2 G3 G2 G3 D2 D3 D2 D3 E2 E3 E2 E3 A2 A3 A2 A3 E2 E3 E2 E3'}]},
 boss:{bpm:160,tr:[{w:'square',v:.06,n:'D5 . D5 C5 D5 . F5 . E5 . D5 . C5 . A4 . D5 . D5 C5 D5 . G5 . F5 E5 D5 C5 D5 . . .'},{w:'sawtooth',v:.08,n:'D2 D2 D3 D2 D2 D3 D2 D2 C2 C2 C3 C2 A1 A1 A2 C2 D2 D2 D3 D2 D2 D3 D2 D2 G1 G1 G2 A1 A1 A2 A1 A1'}]},
 victory:{bpm:130,tr:[{w:'square',v:.07,n:'G4 C5 E5 G5 . E5 G5 . . . A5 . G5 . E5 . C5 . D5 . E5 . . . . . . . . . . .'},{w:'triangle',v:.25,n:'C3 . G2 . C3 . G2 . F2 . C3 . F2 . C3 . G2 . D3 . G2 . D3 . C3 . . . . . . .'}]}
};
for(const k in SONGS)for(const t of SONGS[k].tr)t.n=t.n.split(' ');
let song=null,songStep=0,nextT=0;
function playSong(n){const s=SONGS[n]||null;if(song===s)return;song=s;songStep=0;if(AC)nextT=AC.currentTime+.05}
setInterval(()=>{if(!AC||!song)return;if(nextT<AC.currentTime)nextT=AC.currentTime+.05;const dt=60/song.bpm/2;
 while(nextT<AC.currentTime+.3){if(!muted)for(const t of song.tr){const n=t.n[songStep%t.n.length];if(n!=='.')tone(nf(n),dt*.9,t.w,t.v,nextT-AC.currentTime)}songStep++;nextT+=dt}},60);

// ===== GRAPHICS: tiles, people, creatures, objects (all procedural) =====
function ground(b){rect(b,0,0,16,16,1);[[3,2],[11,5],[6,11],[13,13],[1,8]].forEach(([x,y],i)=>{px(b,x,y,2);if(i%2)px(b,x+1,y,2)})}
function onGround(fn){return b=>{ground(b);const s=mkBuf(16,16);fn(s);outline(s);blit(b,s,0,0)}}
function wallBase(b){rect(b,0,0,16,16,2);for(let x=1;x<16;x+=3)rect(b,x,0,1,16,3);rect(b,0,0,16,1,3);rect(b,0,15,16,1,4)}
const TILEFN={

const xpFor=lv=>Math.floor(.8*lv*lv*lv);
function calcStats(m){const s=SPECIES[m.sp];const old=m.maxhp||0;
 m.maxhp=Math.floor(s.hp*2*m.lv/100)+m.lv+10+(m.own?Math.floor(P.stats.GRIT*m.lv/6):0);
 m.at=Math.floor(s.at*2*m.lv/100)+5;m.df=Math.floor(s.df*2*m.lv/100)+5;m.spd=Math.floor(s.sp*2*m.lv/100)+5;return m.maxhp-old}
function makeMon(sp,lv,own){const m={sp,lv,xp:xpFor(lv),hp:0,moves:[],status:null,own:!!own};calcStats(m);m.hp=m.maxhp;
 const L=SPECIES[sp].learn.filter(l=>l[0]<=lv);const seen=new Set();const uniq=[];for(let i=L.length-1;i>=0&&uniq.length<4;i--){if(!seen.has(L[i][1])){seen.add(L[i][1]);uniq.unshift(L[i][1])}}
 m.moves=uniq.map(id=>({id,pp:MOVES[id].pp}));return m}

function newP(){return{name:'Kestrel',bg:'scav',stats:{GRIT:1,WITS:1,CHARM:1,SCAV:1,AIM:1},bolts:60,party:[],box:[],bag:{GAUZE:2},rep:{settlers:0,choir:0,scorch:-10},q:{main:0,doc:0,debt:0,mast:0},seen:{},caught:{},steps:0,time:0}}
function tileAt(map,x,y){if(x<0||y<0||x>=map.w||y>=map.h)return map.border;const o=map.ov&&map.ov(x,y);return o||map.rows[y][x]}
const npcsOf=m=>m.npcs.filter(n=>!n.cond||n.cond());
const objsOf=m=>m.objs.filter(o=>!o.cond||o.cond());
function npcAt(x,y){return npcsOf(curMap).find(n=>(n.x===x&&n.y===y)||(n.mv&&n.x+n.mv.dx===x&&n.y+n.mv.dy===y))}
function objAt(x,y){return objsOf(curMap).find(o=>o.x===x&&o.y===y)}
function warpAt(x,y){return curMap.warps.find(w=>w.x===x&&w.y===y)}
function blocked(x,y){if(warpAt(x,y))return!!npcAt(x,y);if(x<0||y<0||x>=curMap.w||y>=curMap.h)return true;if(SOLID.has(tileAt(curMap,x,y)))return true;return!!(npcAt(x,y)||objAt(x,y))}
function loadMap(id,x,y,dir){curMap=MAPS[id];pl.x=x;pl.y=y;if(dir!==undefined)pl.dir=dir;pl.moving=false;pl.walking=false;
 for(const n of curMap.npcs){if(n.hx===undefined){n.hx=n.x;n.hy=n.y;n.hd=n.dir}n.x=n.hx;n.y=n.hy;n.dir=n.hd;n.mv=null;n.bang=0}
 playSong(curMap.music);banner={t:110,name:curMap.name};flags['visit_'+id]=1}
function runScript(fn){busy=true;pl.walking=false;Promise.resolve().then(fn).catch(e=>console.error(e)).finally(()=>{busy=false;pl.walking=false})}
function npcStep(n,dir){return new Promise(r=>{const [dx,dy]=DIRS[dir];n.dir=dir;n.mv={dx,dy};n.mt=0;n.par=(n.par||0)^1;n.res=r})}
function tickActors(){if(!curMap)return;for(const n of curMap.npcs){if(n.mv){n.mt+=2;if(n.mt>=16){n.x+=n.mv.dx;n.y+=n.mv.dy;n.mv=null;n.mt=0;if(n.res){const r=n.res;n.res=null;r()}}}
 else if(n.wander&&!busy&&!modals.length&&scene==='ow'&&(!n.cond||n.cond())&&Math.random()<1/100){const d=rand(4);const [dx,dy]=DIRS[d];const nx=n.x+dx,ny=n.y+dy;n.dir=d;
  if(Math.abs(nx-n.hx)<=2&&Math.abs(ny-n.hy)<=2&&!blocked(nx,ny)&&!(nx===pl.x&&ny===pl.y)&&!(pl.moving&&nx===pl.x+pl.dx&&ny===pl.y+pl.dy)&&!warpAt(nx,ny)){n.mv={dx,dy};n.mt=0;n.par=(n.par||0)^1}}}}
function checkTrainers(){for(const n of npcsOf(curMap)){if(!n.trainer||!n.trainer.sight||flags['beat_'+n.id]||n.mv)continue;const [dx,dy]=DIRS[n.dir];
 for(let i=1;i<=n.trainer.sight;i++){const x=n.x+dx*i,y=n.y+dy*i;if(x===pl.x&&y===pl.y)return n;if(SOLID.has(tileAt(curMap,x,y))||npcAt(x,y)||objAt(x,y))break}}return null}
async function trainerSpotted(n){n.bang=1;tone(880,.1,'square',.3);tone(660,.15,'square',.3,.1);await wait(40);n.bang=0;
 while(Math.abs(n.x-pl.x)+Math.abs(n.y-pl.y)>1)await npcStep(n,n.dir);pl.dir=[1,0,3,2][n.dir];await runTrainer(n)}
async function runTrainer(n){const t=n.trainer;for(const l of [].concat(typeof t.intro==='function'?t.intro():t.intro))await say(`${n.name}: ${l}`);if(t.pre&&!(await t.pre(n)))return;
 const team=t.team.map(([s,l])=>makeMon(s,l));const r=await battle(team,{name:n.name,lose:t.lose,reward:t.reward,boss:t.boss});
 if(r==='win'){flags['beat_'+n.id]=1;if(t.after)await t.after(n)}else if(r==='lose')await blackout();if(r==='win')await evolveCheck()}
async function doWarp(w){SFX.door();await fadeOut();loadMap(w.to,w.tx,w.ty,w.dir===undefined?pl.dir:w.dir);await fadeIn()}
async function wildBattle(){const e=curMap.enc;const tot=e.table.reduce((s,r)=>s+r[3],0);let r=Math.random()*tot,row=e.table[0];for(const t of e.table){r-=t[3];if(r<=0){row=t;break}}
 const m=makeMon(row[0],row[1]+rand(row[2]-row[1]+1));const res=await battle([m],null);if(res==='lose')await blackout();else await evolveCheck()}
async function blackout(){await say(`${P.name} blacked out...`);await fadeOut();P.bolts=Math.floor(P.bolts/2);healAll();loadMap('town',16,7,1);await fadeIn();
 await say('Doc Hollis: Dragged you in off the dust. Lost some bolts on the way. Your mons are patched up. Try not to die, yeah?')}
async function evolveCheck(){for(const m of P.party){const s=SPECIES[m.sp];if(!s.evo||m.lv<s.evo[1]||m.hp<=0)continue;const from=m.sp,to=s.evo[0];const oldn=mname(m);
 await say(`What? ${oldn} is mutating!`);await pushModal({t:0,update(){this.t++;if(this.t%Math.max(2,20-Math.floor(this.t/8))===0)tone(300+this.t*4,.05,'square',.2);if(this.t>150)this.done()},
  draw(){fill(1,0,0,160,144);const k=Math.max(2,20-Math.floor(this.t/8));const sp=(Math.floor(this.t/k)%2)?to:from;ctx.drawImage(MSPR[sp].f,60,30);box(0,96,160,48);text('...!?',8,106)}});
 m.sp=to;const d=calcStats(m);m.hp+=d;P.caught[to]=1;P.seen[to]=1;SFX.lvl();await pushModal({t:0,update(){this.t++;if(this.t>20&&(prs.a||prs.b))this.done()},draw(){fill(1,0,0,160,144);ctx.drawImage(MSPR[to].f,60,30);drawTextBox(wrap(`${oldn} mutated into ${SPECIES[to].n}!`),99,true)}})}}
function onStepDone(){P.steps++;const w=warpAt(pl.x,pl.y);if(w){runScript(()=>doWarp(w));return}
 const t=checkTrainers();if(t){runScript(()=>trainerSpotted(t));return}
 if(curMap.onStep){const f=curMap.onStep(pl.x,pl.y);if(f){runScript(f);return}}
 const tile=tileAt(curMap,pl.x,pl.y);if(curMap.enc&&curMap.enc.tiles.includes(tile)&&Math.random()<curMap.enc.rate&&P.party.some(m=>m.hp>0))runScript(wildBattle)}
function tryInteract(){const [dx,dy]=DIRS[pl.dir];let fx=pl.x+dx,fy=pl.y+dy;if(tileAt(curMap,fx,fy)==='K'){fx+=dx;fy+=dy}
 const n=npcAt(fx,fy);if(n&&!n.mv){runScript(async()=>{n.dir=[1,0,3,2][pl.dir];if(n.trainer&&!flags['beat_'+n.id]&&!n.talk)await runTrainer(n);else if(n.talk)await n.talk(n);else if(n.trainer)await say(`${n.name}: ${[].concat(n.trainer.post||'...')[0]}`)});return true}
 const o=objAt(fx,fy);if(o){runScript(()=>objInteract(o));return true}
 const ins=curMap.inspect&&curMap.inspect[fx+','+fy];if(ins){runScript(ins);return true}return false}
const SCAVT=[['SCRAP',6],['WIRE',3],['GAUZE',2],['JAR',2],['$',3],['PURGE',1],['FUSE',1]];
async function objInteract(o){if(o.type==='sign'){await say(o.text);return}
 if(o.type==='scav'){if(flags['scav_'+o.id]){await say('Picked clean. Just dust and bottle glass.');return}flags['scav_'+o.id]=1;SFX.dice();
  await say(pick(['You dig through the junk heap...','You rummage through the wreckage...','You pry open a rusted locker...']));
  for(const [id,n] of (o.loot||[]))await getItem(id,n);
  let extra=1+(P.stats.SCAV>=4?1:0)+(flags.scavTips?1:0);if(rand(6)+1+P.stats.SCAV>=8)extra++;
  for(let i=0;i<extra;i++){const tot=SCAVT.reduce((s,r)=>s+r[1],0);let r=Math.random()*tot,id='SCRAP';for(const [k,w] of SCAVT){r-=w;if(r<=0){id=k;break}}
   if(id==='$'){const b=5+rand(10)+P.stats.SCAV*3;P.bolts+=b;SFX.item();await say(`Found ${b} bolts!`)}else await getItem(id,id==='SCRAP'?1+rand(2):1)}
  if(o.after)await o.after()}}
function owUpdate(){
 if(pl.moving){pl.mt+=2;if(pl.mt>=16){pl.x+=pl.dx;pl.y+=pl.dy;pl.moving=false;pl.mt=0;onStepDone();if(busy)return}else return}
 if(prs.start){openStartMenu();return}
 if(prs.a){if(tryInteract())return;if(prs.enter){openStartMenu();return}}
 const d=(held.up||prs.up)?1:(held.down||prs.down)?0:(held.left||prs.left)?2:(held.right||prs.right)?3:-1;
 if(d<0){pl.walking=false;pl.turn=0;return}
 if(d!==pl.dir&&!pl.walking){pl.dir=d;pl.turn=4;return}
 if(pl.turn>0){pl.turn--;return}
 const [dx,dy]=DIRS[d];pl.dir=d;if(blocked(pl.x+dx,pl.y+dy)){if(!pl.bumpT||FC-pl.bumpT>18){SFX.bump();pl.bumpT=FC}pl.walking=false;return}
 pl.moving=true;pl.walking=true;pl.dx=dx;pl.dy=dy;pl.mt=0;pl.par^=1}
function drawOW(){const ox=pl.x*16+(pl.moving?pl.dx*pl.mt:0),oy=pl.y*16+(pl.moving?pl.dy*pl.mt:0);const cx=ox-64,cy=oy-64;
 const tx0=Math.floor(cx/16),ty0=Math.floor(cy/16);const af=(FC>>5)&1;
 for(let ty=ty0;ty<=ty0+9;ty++)for(let tx=tx0;tx<=tx0+10;tx++){const t=TILES[tileAt(curMap,tx,ty)]||TILES['#'];ctx.drawImage(t[af],tx*16-cx,ty*16-cy)}
 for(const o of objsOf(curMap)){const s=o.type==='scav'?(flags['scav_'+o.id]?OBJSPR.looted:OBJSPR.pile):OBJSPR.sign;ctx.drawImage(s,o.x*16-cx,o.y*16-cy)}
 const actors=npcsOf(curMap).map(n=>({x:n.x*16+(n.mv?n.mv.dx*n.mt:0),y:n.y*16+(n.mv?n.mv.dy*n.mt:0),spr:n._spr||(n._spr=personSpr(n.look)),dir:n.dir,fr:n.mv?(n.mt<8?1+(n.par||0):0):0,bang:n.bang,tx:n.x,ty:n.y,mv:n.mv}));
 actors.push({x:ox,y:oy,spr:personSpr(PLAYER_LOOK),dir:pl.dir,fr:pl.moving?(pl.mt<8?1+pl.par:0):0,tx:pl.x,ty:pl.y,mv:pl.moving});
 actors.sort((a,b)=>a.y-b.y);
 for(const a of actors){const x=a.x-cx,y=a.y-cy;ctx.drawImage(a.spr[a.dir][a.fr],x,y-4);
  if(!a.mv&&tileAt(curMap,a.tx,a.ty)==='v')ctx.drawImage(TILES.v[af],0,11,16,5,x,y+11,16,5);
  if(a.bang)ctx.drawImage(OBJSPR.bang,x+5,y-14)}
 if(banner&&banner.t>0){banner.t--;if(!modals.length){const w=banner.name.length*6+14;box(0,0,w,18);text(banner.name,7,5)}}}
// ----- menus
function openStartMenu(){SFX.sel();runScript(async()=>{let idx=0;while(true){
 const c=await choose(['MONS','BAG','JOURNAL',P.name.slice(0,8).toUpperCase(),'SAVE','SOUND:'+(muted?'OFF':'ON'),'EXIT'],{cancel:true,x:86,y:0,w:74,idx,vis:7});
 if(c<0||c===6)break;idx=c;if(c===0)await partyMenu();if(c===1)await bagMenu();if(c===2)await journal();if(c===3)await statusScreen();
 if(c===4){if(await yesno('Save your progress?')){saveGame();SFX.ok();await say(`${P.name} scratched the day's tally into the save-slate.`)}}if(c===5)muted=!muted}})}
async function partyMenu(){let i=0;while(true){i=await partyScreen({msg:'Choose a mon.',idx:i});if(i<0)return;const o=await choose(['STATS','SWITCH','CANCEL'],{cancel:true});
 if(o===0)await monSummary(P.party[i]);if(o===1){const j=await partyScreen({msg:'Move to which slot?',idx:i});if(j>=0&&j!==i){const t=P.party[i];P.party[i]=P.party[j];P.party[j]=t;SFX.ok()}}}}
async function bagMenu(){let idx=0;while(true){const ids=Object.keys(P.bag).filter(k=>P.bag[k]>0);const items=[{l:'> Craft...',d:'Build capture devices and medicine from scavenged parts.'}].concat(ids.map(k=>({l:ITEMS[k].n,r:ITEMS[k].key?'KEY':'x'+P.bag[k],d:ITEMS[k].d})));
 const i=await listMenu({title:'BAG',sub:P.bolts+'b',items,idx});if(i<0)return;idx=i;if(i===0){await craftMenu();continue}const id=ids[i-1],it=ITEMS[id];
 if(it.heal||it.cure||it.revive){const t=await partyScreen({msg:`Use ${it.n} on which mon?`});if(t<0)continue;if(!canUse(it,P.party[t])){await say("It won't have any effect.");continue}take(id);await applyItem(it,P.party[t])}
 else if(it.cap)await say('Capture devices are thrown during wild battles.');else await say(it.d)}}
async function craftMenu(){let idx=0;while(true){const items=RECIPES.map(r=>{const ok=Object.entries(r.req).every(([k,n])=>has(k,n));return{l:ITEMS[r.out].n+(r.n>1?' x'+r.n:''),r:ok?'OK':'--',dim:!ok,d:'Needs: '+Object.entries(r.req).map(([k,n])=>`${ITEMS[k].n} x${n} (${P.bag[k]||0})`).join(', ')}});
 const i=await listMenu({title:'CRAFT',items,idx});if(i<0)return;idx=i;const r=RECIPES[i];if(!Object.entries(r.req).every(([k,n])=>has(k,n))){SFX.no();await say("You don't have the parts.");continue}
 for(const [k,n] of Object.entries(r.req))take(k,n);tone(200,.05);tone(300,.05,'square',.2,.08);await getItem(r.out,r.n)}}
async function journal(){let idx=0;while(true){const items=QUESTS.filter(q=>P.q[q.id]>0).map(q=>({l:q.n,r:P.q[q.id]>=q.done?'DONE':'',dim:P.q[q.id]>=q.done,d:q.text()}));
 const i=await listMenu({title:'JOURNAL',items,idx});if(i<0)return;idx=i;await say(items[i].d)}}
function statusScreen(){return pushModal({update(){if(prs.a||prs.b){SFX.sel();this.done()}},draw(){fill(1,0,0,160,144);box(0,0,160,144);ctx.drawImage(personSpr(PLAYER_LOOK)[0][0],136,6);
 text(P.name,8,7);text(BGS.find(b=>b.id===P.bg).n,8,17,3);STATS.forEach((s,i)=>{text(s,8,30+i*10);text(String(P.stats[s]),50,30+i*10);for(let k=0;k<P.stats[s];k++)fill(3,60+k*6,31+i*10,4,6)});
 text('BOLTS '+P.bolts,8,84);text('CAUGHT '+Object.keys(P.caught).length+'/'+Object.keys(SPECIES).length,8,94);
 fill(4,6,105,148,1);[['Rustwater','settlers'],['Iron Choir','choir'],['Scorch Gang','scorch']].forEach(([n,k],i)=>{text(n,8,109+i*10);text(REPN(P.rep[k]),152-REPN(P.rep[k]).length*6,109+i*10)})}})}
function priceMul(){let m=1.2-.05*P.stats.CHARM;if(flags.tradeDeal)m-=.1;if(flags.ending==='choir')m+=.25;if(flags.ending==='settlers')m-=.1;return Math.max(.6,m)}
async function shop(stock){while(true){const c=await choose(['BUY','SELL','LEAVE'],{prompt:'Brass: What are you after?',cancel:true});if(c<0||c===2)return;
 if(c===0){let idx=0;while(true){const items=stock.map(k=>({l:ITEMS[k].n,r:Math.ceil(ITEMS[k].price*priceMul())+'b',d:ITEMS[k].d}));const i=await listMenu({title:'BUY',sub:P.bolts+'b',items,idx});if(i<0)break;idx=i;
  const pr=Math.ceil(ITEMS[stock[i]].price*priceMul());const mx=Math.floor(P.bolts/pr);if(mx<1){SFX.no();await say("Brass: You're short on bolts, friend.");continue}const n=await pickQty(Math.min(mx,99),pr);if(!n)continue;P.bolts-=n*pr;give(stock[i],n);SFX.item();await say(`Bought ${ITEMS[stock[i]].n} x${n}.`)}}
 if(c===1){let idx=0;while(true){const ids=Object.keys(P.bag).filter(k=>P.bag[k]>0&&!ITEMS[k].key);const items=ids.map(k=>({l:ITEMS[k].n,r:Math.floor(ITEMS[k].price/2)+'b x'+P.bag[k],d:ITEMS[k].d}));
  const i=await listMenu({title:'SELL',sub:P.bolts+'b',items,idx});if(i<0)break;idx=i;const id=ids[i];const pr=Math.max(1,Math.floor(ITEMS[id].price/2));const n=await pickQty(P.bag[id],pr);if(!n)continue;take(id,n);P.bolts+=n*pr;SFX.item();await say(`Sold for ${n*pr} bolts.`)}}}}
async function crateMenu(){while(true){const c=await choose(['TAKE OUT','PUT IN','LEAVE'],{prompt:`Pell's crate holds ${P.box.length} mon${P.box.length===1?'':'s'}.`,cancel:true});if(c<0||c===2)return;
 if(c===0){if(!P.box.length){await say('The crate is empty.');continue}if(P.party.length>=6){await say('Your party is full. Put one in first.');continue}
  const i=await listMenu({title:'CRATE',items:P.box.map(m=>({l:mname(m),r:'Lv'+m.lv,d:SPECIES[m.sp].d}))});if(i<0)continue;P.party.push(P.box.splice(i,1)[0]);SFX.ok()}
 if(c===1){if(P.party.length<=1){await say('You need to keep at least one mon.');continue}const i=await partyScreen({msg:'Put which mon in the crate?'});if(i<0)continue;P.box.push(P.party.splice(i,1)[0]);SFX.ok()}}}

async function epilogue(){const E=flags.ending;const lines=[];
 if(E==='settlers')lines.push('The Still coughs, shudders, and runs clear.','Rustwater drinks deep for the first time in weeks.','Ottilie carves your name over the well.');
 if(E==='choir')lines.push('The Choir installs the Core in their spire.','Rustwater still drinks... at two bolts a cup.','Sister Cathode sings your name in her hymns.');
 if(E==='scorch')lines.push('King Axlegrind bolts the Core to his throne.','Every drop in the Ashlands now flows through Scorch Fort.','You ride at his right hand, feared and thirsty no more.');

async function talkOttilie(){const q=P.q.main;
 if(q===0){await say("Ottilie: You're the drifter Pell took in. Look at this. Look at it!");await say('Ottilie: The Still. Our purifier. Three nights ago the Scorch Gang ripped out its Purifier Core and rode east.');
  await say('Ottilie: Without it, Rustwater has two weeks of clean water. Then we drink sludge... or we die.');let deal=100;
  while(true){const r=await dlg('Ottilie: Will you get the Core back from King Axlegrind?',[{k:'yes',t:"I'll get it back."},{k:'pay',t:"What's it pay?",if:!flags.mayorAsk},
   {k:'charm',t:'Pay me more.',st:'CHARM',dc:3,id:'may_ch'},{k:'scav',t:'Build one?',bg:'scav'},{k:'hag',t:'Haggle.',bg:'caravan',if:deal<175},{k:'no',t:'Not my problem.'}]);
   if(r.k==='pay'){flags.mayorAsk=1;await say("Ottilie: 100 bolts. It's all the town can scrape together.")}
   if(r.k==='charm'){if(r.ok){deal=200;await say('Ottilie: ...Fine. 200 bolts, and Rustwater owes you a favor.')}else await say("Ottilie: Don't push it, drifter. People here are dying.")}
   if(r.k==='scav')await say("Ottilie: It's pre-Fall tech. Nobody can build one. Except maybe the Iron Choir, and they don't share.");
   if(r.k==='hag'){deal=175;await say('Ottilie: You talk like a caravan boss. 175, and not a bolt more.')}
   if(r.k==='no'){await say('Ottilie: Then enjoy the dust while it lasts.');return}
   if(r.k==='yes'){P.q.main=1;flags.mayorReward=deal;SFX.item();await say(`Ottilie: Bless you. ${deal} bolts when the Core is back in the Still.`);await say('Ottilie: Scorch Fort is east, past the Ashfields. The road is crawling with raiders and mutants. Heal up at Doc Hollis first.');
    await say('[New quest: The Last Drop]');await rep('settlers',5);return}}}
 if(q===1||q===2){await say('Ottilie: Scorch Fort is east, past the Ashfields. Please hurry. The barrels are getting low.');return}
 if(q===3){const r=await dlg('Ottilie: Is that... you have it! The Purifier Core!',[{k:'give',t:"Here. It's yours."},{k:'wait',t:'Not yet.'}]);
  if(r.k==='give')await endingSettlers();else await say("Ottilie: Not yet? ...What does that mean?");return}
 if(flags.ending==='settlers')await say('Ottilie: Hear that gurgle? That is the sound of a town that gets to live. Thanks to you.');
 else if(flags.ending==='choir')await say('Ottilie: Two bolts a cup. That is what the Choir charges us now. I hope their coin keeps you warm.');
 else await say("Ottilie: Get out of my sight, raider. Axlegrind's dog.")}
async function talkBrass(){const stock=['GAUZE','TONIC','PURGE','SALTS','JAR','CAGE','WIRE','SCRAP'];if(P.rep.choir>=20)stock.push('TESLA');
 while(true){const r=await dlg(flags.ending==='choir'?'Brass: Prices went up. Water costs now, so everything costs.':'Brass: Scrap, meds, jars. Buy, sell, or browse.',[
  {k:'trade',t:'Trade.'},{k:'scav',t:'Talk shop.',bg:'scav',if:!flags.tradeDeal},{k:'car',t:'Road tales.',bg:'caravan',if:!flags.tradeDeal},
  {k:'ch',t:'Any specials?',st:'CHARM',dc:4,id:'brass_ch'},{k:'rum',t:'Heard anything?'},{k:'bye',t:'Bye.'}]);
  if(r.k==='trade')await shop(stock);
  if(r.k==='scav'||r.k==='car'){flags.tradeDeal=1;await say(r.k==='scav'?"Brass: A fellow junk-diver! You know a fused coil from a dud. I'll give you the insider rate.":"Brass: Ha! Ran the salt road too, eh? Insider rate for you, friend.");SFX.item();await say('[Trader prices -10%]')}
  if(r.k==='ch'){if(r.ok){await say("Brass: Fine, fine. Take this Cage Can. Don't tell the others.");await getItem('CAGE',1)}else await say('Brass: Specials? Everything is special. Special price, too.')}
  if(r.k==='rum')await say(pick(["Brass: Dice Mo in the bar cheats. Everybody knows. Nobody can prove it.","Brass: Combine 2 Scrap and a Copper Wire and you got yourself a Snare Jar. Check your BAG's craft menu.","Brass: The Iron Choir pays big for pre-Fall tech. Too big. Makes you wonder."]));
  if(r.k==='bye'||r.k===undefined){await say('Brass: Keep your boots dry.');return}}}
async function talkDoc(){const free=P.q.doc>=2||P.rep.settlers>=30||flags.ending==='settlers';const cost=flags.ending==='choir'?20:10;
 while(true){const r=await dlg('Doc Hollis: Clinic is open. What hurts?',[{k:'heal',t:free?'Heal my mons. (free)':`Heal my mons. (${cost}b)`},{k:'q',t:'Need anything?',if:P.q.doc===0},
  {k:'give',t:'Got your Glowcaps.',if:P.q.doc===1&&has('GLOWCAP',3)},{k:'nov',t:'Choir meds?',bg:'choir'},{k:'bye',t:'Bye.'}]);

  if(r.k==='q'){await say('Doc Hollis: Glowcaps. Fungus that grows in the junk heaps out in the Ashfields. I brew them into medicine.');await say('Doc Hollis: Bring me 3 and I will make it worth your while. Healing here, free, for life.');P.q.doc=1;await say('[New quest: Glow in the Dark]')}

 if(scene==='title')drawTitle();else if(scene==='ow'&&curMap)drawOW();else if(scene==='battle'&&B)drawBattle();else fill(4,0,0,160,144);
 for(const m of modals)m.draw&&m.draw();

function update(){FC++;tickTimers();if(modals.length)modals[modals.length-1].update();else if(scene==='ow'&&!busy)owUpdate();tickActors();for(const k in prs)prs[k]=false}
let lastT=0,accT=0;
let errCount=0;
function loop(t){requestAnimationFrame(loop);if(!lastT)lastT=t;accT+=Math.min(100,t-lastT);lastT=t;try{draw();let n=0;while(accT>=1000/60&&n<3){accT-=1000/60;update();n++}}catch(e){if(errCount++<5)console.error('frame error',e&&e.stack||e);for(const k in prs)prs[k]=false}}
